<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BROWN Bakery - Order Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        navyPrimary: '#1B365D',
                        navyDark: '#0A192F',
                        goldAccent: '#D4AF37',
                        bgSoft: '#F8FAFC',
                        cardWhite: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .btn-press:active { transform: scale(0.96); transition: transform 0.1s; }
    </style>
</head>
<body class="bg-bgSoft font-sans pb-32 text-slate-800">

    <!-- Premium Header with Logo -->
    <div class="bg-navyPrimary text-center py-6 px-4 shadow-xl relative overflow-hidden rounded-b-3xl mb-5">
        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/5 rounded-full blur-2xl"></div>
        <div class="absolute -left-10 -top-10 w-40 h-40 bg-goldAccent/10 rounded-full blur-2xl"></div>
        
        <!-- Logo Container -->
        <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl inline-block mb-3 border border-white/20 shadow-inner">
            <img src="Logo PNG-white.png" alt="Independence Hotel Logo" class="h-12 mx-auto object-contain" onerror="this.style.display='none'">
        </div>
        
        <h1 class="text-white text-lg font-extrabold tracking-widest uppercase">BROWN Bakery Order</h1>
        <p class="text-slate-300 text-xs mt-1 font-medium">Independence Hotel & Resorts</p>
    </div>

    <form id="orderForm" class="p-4 max-w-md mx-auto space-y-5">
        
        <!-- Order Details Card -->
        <div class="bg-cardWhite p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
            <div class="flex items-center space-x-2 border-b border-slate-100 pb-3">
                <div class="w-8 h-8 rounded-xl bg-navyPrimary/10 flex items-center justify-center text-navyPrimary">
                    <i class="fa-solid fa-store text-sm"></i>
                </div>
                <h2 class="font-bold text-navyPrimary text-base">Outlet & Schedule</h2>
            </div>
            
            <div class="space-y-3.5">
                <!-- Branch Selection -->
                <div>
                    <label class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 block">Shop Name *</label>
                    <div class="relative">
                        <select id="branch" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navyPrimary focus:border-navyPrimary appearance-none font-semibold text-slate-700">
                            <option value="">Select Branch...</option>
                            <option value="BROWN - Independence Beach">BROWN - Independence Beach</option>
                            <option value="BROWN - Seaview">BROWN - Seaview</option>
                            <option value="BROWN - Island View (R9)">BROWN - Island View (R9)</option>
                        </select>
                        <i class="fa-solid fa-location-dot absolute left-3.5 top-3.5 text-slate-400"></i>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <!-- Date & Time Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 block">Order Date *</label>
                        <div class="relative">
                            <input type="date" id="orderDate" required class="w-full pl-9 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navyPrimary font-semibold text-slate-700">
                            <i class="fa-regular fa-calendar absolute left-3.5 top-3.5 text-slate-400"></i>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 block">Pickup Time *</label>
                        <div class="relative">
                            <input type="time" id="pickupTime" required class="w-full pl-9 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navyPrimary font-semibold text-slate-700">
                            <i class="fa-regular fa-clock absolute left-3.5 top-3.5 text-slate-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Ordered By -->
                <div>
                    <label class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 block">Ordered By *</label>
                    <div class="relative">
                        <input type="text" id="orderedBy" placeholder="Staff Name" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navyPrimary font-semibold text-slate-700">
                        <i class="fa-regular fa-user absolute left-3.5 top-3.5 text-slate-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Section Title -->
        <div class="flex items-center justify-between px-1 mt-6 mb-2">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-xl bg-navyPrimary/10 flex items-center justify-center text-navyPrimary">
                    <i class="fa-solid fa-utensils text-sm"></i>
                </div>
                <h2 class="font-bold text-navyPrimary text-base">Bakery Menu</h2>
            </div>
            <span class="text-xs font-bold text-slate-400 uppercase">7 Items</span>
        </div>

        <!-- Menu List Container -->
        <div id="menuContainer" class="space-y-3"></div>

        <!-- Sticky Footer Summary -->
        <div class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 p-4 z-20 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.1)] rounded-t-3xl">
            <div class="max-w-md mx-auto flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">Total Amount</p>
                    <p class="text-2xl font-black text-navyDark">$<span id="totalDisplay">0.00</span></p>
                </div>
                <button type="submit" id="submitBtn" class="bg-navyPrimary hover:bg-navyDark text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-navyPrimary/30 transition-all flex items-center space-x-2 btn-press">
                    <span>PLACE ORDER</span> 
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </form>

    <script>
        const bakeryItems = [
            { id: 'item1', name: 'Pain Croissant', price: 2.00 },
            { id: 'item2', name: 'Chocolate Croissant', price: 2.50 },
            { id: 'item3', name: 'Almond Croissant', price: 2.80 },
            { id: 'item4', name: 'Banana Cake', price: 1.50 },
            { id: 'item5', name: 'Pain au Raisin Roll', price: 2.50 },
            { id: 'item6', name: 'Danish Banana', price: 2.20 },
            { id: 'item7', name: 'Danish Apple', price: 2.20 }
        ];

        const menuContainer = document.getElementById('menuContainer');
        const quantities = {};

        bakeryItems.forEach(item => {
            quantities[item.id] = 0; 
            
            const card = document.createElement('div');
            card.className = "bg-cardWhite p-4 rounded-2xl shadow-sm border border-slate-200/80 flex justify-between items-center transition-all hover:border-navyPrimary/40 hover:shadow-md";
            card.innerHTML = `
                <div class="flex-1 pr-3">
                    <h3 class="font-bold text-sm text-slate-900">${item.name}</h3>
                    <p class="text-navyPrimary text-xs font-bold mt-0.5">$${item.price.toFixed(2)}</p>
                </div>
                <div class="flex items-center space-x-2.5 bg-slate-50 rounded-xl p-1.5 border border-slate-200 shadow-inner">
                    <button type="button" class="w-8 h-8 flex items-center justify-center text-navyPrimary bg-white rounded-lg shadow-sm border border-slate-200 btn-press font-bold hover:bg-slate-50" onclick="updateQty('${item.id}', -1, ${item.price})">
                        <i class="fa-solid fa-minus text-xs"></i>
                    </button>
                    <span id="qty-${item.id}" class="font-black text-navyDark w-6 text-center text-sm">0</span>
                    <button type="button" class="w-8 h-8 flex items-center justify-center text-white bg-navyPrimary rounded-lg shadow-md shadow-navyPrimary/20 btn-press font-bold hover:bg-navyDark" onclick="updateQty('${item.id}', 1, ${item.price})">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>
            `;
            menuContainer.appendChild(card);
        });

        let totalQty = 0;
        let totalAmount = 0.00;

        window.updateQty = function(id, change, price) {
            let currentQty = quantities[id];
            let newQty = currentQty + change;
            if (newQty < 0) return; 

            quantities[id] = newQty;
            document.getElementById(`qty-${id}`).innerText = newQty;

            totalQty += change;
            totalAmount += (change * price);
            
            document.getElementById('totalDisplay').innerText = totalAmount.toFixed(2);
        };

        document.getElementById('orderDate').valueAsDate = new Date();

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (totalQty === 0) {
                alert("Please add at least one bakery item to your order!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> <span>SENDING...</span>`;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80');

            const data = {
                branch: document.getElementById('branch').value,
                orderDate: document.getElementById('orderDate').value,
                item1: quantities['item1'] || 0,
                item2: quantities['item2'] || 0,
                item3: quantities['item3'] || 0,
                item4: quantities['item4'] || 0,
                item5: quantities['item5'] || 0,
                item6: quantities['item6'] || 0,
                item7: quantities['item7'] || 0,
                pickupTime: document.getElementById('pickupTime').value,
                orderedBy: document.getElementById('orderedBy').value,
                totalQty: totalQty,
                totalAmount: totalAmount.toFixed(2)
            };

            const webAppUrl = "https://script.google.com/macros/s/AKfycbxoG9cwwyJ9HK2tkiXMtrKJ_Axj3evXW6mPxx5Sf6eNHOxCWubZNJSdjh0S4HH_7DIT9g/exec"; 

            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                submitBtn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> <span>SUCCESS!</span>`;
                submitBtn.style.backgroundColor = "#10B981";
                setTimeout(() => { window.location.reload(); }, 2500);
            }).catch(error => {
                console.error(error);
                submitBtn.innerHTML = `ERROR - TRY AGAIN`;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80');
            });
        });
    </script>
</body>
</html>
