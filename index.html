<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bakery Order App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        navyPrimary: '#1B365D',
                        navyDark: '#0A192F',
                        navyLight: '#2C5282',
                        bgWhite: '#F8FAFC',
                        cardWhite: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-bgWhite font-sans pb-28 text-slate-800">

    <!-- App Header -->
    <div class="bg-navyPrimary text-white p-5 shadow-lg sticky top-0 z-10 rounded-b-2xl mb-4">
        <div class="flex items-center justify-center max-w-md mx-auto">
            <h1 class="text-xl font-bold tracking-widest uppercase flex items-center">
                <i class="fa-solid fa-croissant mr-3 text-white opacity-90"></i> 
                BROWN BAKERY
            </h1>
        </div>
    </div>

    <form id="orderForm" class="p-4 max-w-md mx-auto space-y-5">
        
        <!-- Order Details Card -->
        <div class="bg-cardWhite p-5 rounded-2xl shadow-sm border border-slate-200/60 space-y-4">
            <div class="flex items-center mb-3">
                <i class="fa-solid fa-clipboard-list text-navyPrimary mr-2"></i>
                <h2 class="font-bold text-navyPrimary text-lg">Order Details</h2>
            </div>
            
            <div class="space-y-3">
                <!-- Branch -->
                <div>
                    <label class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 block">Shop Name *</label>
                    <div class="relative">
                        <select id="branch" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navyPrimary focus:border-navyPrimary appearance-none font-medium">
                            <option value="">Select Branch...</option>
                            <option value="BROWN - Independence Beach">BROWN - Independence Beach</option>
                            <option value="BROWN - Seaview">BROWN - Seaview</option>
                            <option value="BROWN - Island View (R9)">BROWN - Island View (R9)</option>
                        </select>
                        <i class="fa-solid fa-store absolute left-3.5 top-3.5 text-slate-400"></i>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <!-- Date & Time Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 block">Date *</label>
                        <div class="relative">
                            <input type="date" id="orderDate" required class="w-full pl-9 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navyPrimary font-medium">
                            <i class="fa-regular fa-calendar absolute left-3.5 top-3.5 text-slate-400"></i>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 block">Pickup *</label>
                        <div class="relative">
                            <input type="time" id="pickupTime" required class="w-full pl-9 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navyPrimary font-medium">
                            <i class="fa-regular fa-clock absolute left-3.5 top-3.5 text-slate-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Ordered By -->
                <div>
                    <label class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 block">Ordered By *</label>
                    <div class="relative">
                        <input type="text" id="orderedBy" placeholder="Staff Name" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-navyPrimary font-medium">
                        <i class="fa-regular fa-user absolute left-3.5 top-3.5 text-slate-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Title -->
        <div class="flex items-center px-1 mt-6 mb-2">
            <i class="fa-solid fa-bag-shopping text-navyPrimary mr-2"></i>
            <h2 class="font-bold text-navyPrimary text-lg">Menu Selection</h2>
        </div>

        <!-- Menu List Container -->
        <div id="menuContainer" class="space-y-3"></div>

        <!-- Sticky Footer -->
        <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-4 z-20 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] rounded-t-2xl">
            <div class="max-w-md mx-auto flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Total Amount</p>
                    <p class="text-2xl font-black text-navyDark">$<span id="totalDisplay">0.00</span></p>
                </div>
                <button type="submit" id="submitBtn" class="bg-navyPrimary hover:bg-navyDark text-white px-8 py-3.5 rounded-xl font-bold shadow-lg shadow-navyPrimary/30 transition-all flex items-center btn-press">
                    <span>SUBMIT</span> <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>
    </form>

    <script>
        const bakeryItems = [
            { id: 'item1', name: 'Pain Croissant', price: 2.00 },
            { id: 'item2', name: 'Chocolate Croissant', price: 2.50 },
            { id: 'item3', name: 'Almond Croissant', price: 2.80 },
            { id: 'item4', name: 'Banana Cake', price: 1.50 },
            { id: 'item5', name: 'Pain au Raisin Roll', price: 2.50 },
            { id: 'item6', name: 'Danish Banana', price: 2.20 },
            { id: 'item7', name: 'Danish Apple', price: 2.20 }
        ];

        const menuContainer = document.getElementById('menuContainer');
        const quantities = {};

        bakeryItems.forEach(item => {
            quantities[item.id] = 0; 
            
            const card = document.createElement('div');
            card.className = "bg-cardWhite p-4 rounded-2xl shadow-sm border border-slate-200/60 flex justify-between items-center transition-all hover:border-navyPrimary/30";
            card.innerHTML = `
                <div class="flex-1">
                    <h3 class="font-bold text-sm text-navyDark">${item.name}</h3>
                    <p class="text-navyLight text-xs font-bold mt-0.5">$${item.price.toFixed(2)}</p>
                </div>
                <div class="flex items-center space-x-3 bg-slate-50 rounded-xl p-1.5 border border-slate-200">
                    <button type="button" class="w-8 h-8 flex items-center justify-center text-navyPrimary bg-white rounded-lg shadow-sm border border-slate-200 btn-press" onclick="updateQty('${item.id}', -1, ${item.price})">
                        <i class="fa-solid fa-minus text-xs"></i>
                    </button>
                    <span id="qty-${item.id}" class="font-bold text-navyDark w-5 text-center text-sm">0</span>
                    <button type="button" class="w-8 h-8 flex items-center justify-center text-white bg-navyPrimary rounded-lg shadow-sm shadow-navyPrimary/20 btn-press" onclick="updateQty('${item.id}', 1, ${item.price})">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>
            `;
            menuContainer.appendChild(card);
        });

        let totalQty = 0;
        let totalAmount = 0.00;

        window.updateQty = function(id, change, price) {
            let currentQty = quantities[id];
            let newQty = currentQty + change;
            if (newQty < 0) return; 

            quantities[id] = newQty;
            document.getElementById(`qty-${id}`).innerText = newQty;

            totalQty += change;
            totalAmount += (change * price);
            
            document.getElementById('totalDisplay').innerText = totalAmount.toFixed(2);
        };

        document.getElementById('orderDate').valueAsDate = new Date();

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (totalQty === 0) {
                alert("Please add at least one bakery item to your order!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> <span>SENDING...</span>`;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80');

            const data = {
                branch: document.getElementById('branch').value,
                orderDate: document.getElementById('orderDate').value,
                item1: quantities['item1'] || 0,
                item2: quantities['item2'] || 0,
                item3: quantities['item3'] || 0,
                item4: quantities['item4'] || 0,
                item5: quantities['item5'] || 0,
                item6: quantities['item6'] || 0,
                item7: quantities['item7'] || 0,
                pickupTime: document.getElementById('pickupTime').value,
                orderedBy: document.getElementById('orderedBy').value,
                totalQty: totalQty,
                totalAmount: totalAmount.toFixed(2)
            };

            const webAppUrl = "https://script.google.com/macros/s/AKfycbxoG9cwwyJ9HK2tkiXMtrKJ_Axj3evXW6mPxx5Sf6eNHOxCWubZNJSdjh0S4HH_7DIT9g/exec"; 

            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                submitBtn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> <span>SUCCESS</span>`;
                submitBtn.style.backgroundColor = "#10B981";
                setTimeout(() => { window.location.reload(); }, 2500);
            }).catch(error => {
                console.error(error);
                submitBtn.innerHTML = `ERROR - TRY AGAIN`;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80');
            });
        });
    </script>
</body>
</html>
