<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BROWN Bakery - Order App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        navyPrimary: '#1B365D',
                        navyDark: '#0A192F',
                        bgSoft: '#F8FAFC',
                        cardWhite: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .btn-press:active { transform: scale(0.96); transition: transform 0.1s; }
    </style>
</head>
<body class="bg-bgSoft font-sans pb-28 text-slate-800 text-xs sm:text-sm">

    <!-- Compact Mobile Header -->
    <div class="bg-navyPrimary text-center py-4 px-3 shadow-md rounded-b-2xl mb-3">
        <div class="bg-white/10 backdrop-blur-md p-2 rounded-xl inline-block mb-1.5 border border-white/10 shadow-inner">
            <img src="Logo PNG-white.png" alt="Logo" class="h-8 mx-auto object-contain" onerror="this.style.display='none'">
        </div>
        <h1 class="text-white text-sm font-extrabold tracking-widest uppercase">BROWN BAKERY ORDER</h1>
        <p class="text-slate-300 text-[10px] mt-0.5 font-medium tracking-wide">INDEPENDENCE HOTEL BY DARA</p>
    </div>

    <form id="orderForm" class="px-3 max-w-md mx-auto space-y-3">
        
        <!-- Compact Order Details Card -->
        <div class="bg-cardWhite p-3.5 rounded-xl shadow-sm border border-slate-200/80 space-y-2.5">
            <div class="flex items-center space-x-1.5 border-b border-slate-100 pb-2">
                <i class="fa-solid fa-store text-navyPrimary text-xs"></i>
                <h2 class="font-bold text-navyPrimary text-xs uppercase">Outlet & Schedule</h2>
            </div>
            
            <div class="space-y-2">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-0.5 block">Shop Name *</label>
                    <div class="relative">
                        <select id="branch" required class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-navyPrimary appearance-none font-semibold text-slate-700">
                            <option value="">Select Branch...</option>
                            <option value="BROWN - Independence Beach">BROWN - Independence Beach</option>
                            <option value="BROWN - Seaview">BROWN - Seaview</option>
                            <option value="BROWN - Island View (R9)">BROWN - Island View (R9)</option>
                        </select>
                        <i class="fa-solid fa-location-dot absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-slate-400 text-[10px]"></i>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-0.5 block">Order Date *</label>
                        <div class="relative">
                            <input type="date" id="orderDate" required class="w-full pl-7 pr-2 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-navyPrimary font-semibold text-slate-700">
                            <i class="fa-regular fa-calendar absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-0.5 block">Pickup Time *</label>
                        <div class="relative">
                            <input type="time" id="pickupTime" required class="w-full pl-7 pr-2 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-navyPrimary font-semibold text-slate-700">
                            <i class="fa-regular fa-clock absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-0.5 block">Ordered By *</label>
                    <div class="relative">
                        <input type="text" id="orderedBy" placeholder="Staff Name" required class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-navyPrimary font-semibold text-slate-700">
                        <i class="fa-regular fa-user absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Section Title -->
        <div class="flex items-center justify-between px-1 pt-1">
            <div class="flex items-center space-x-1.5">
                <i class="fa-solid fa-utensils text-navyPrimary text-xs"></i>
                <h2 class="font-bold text-navyPrimary text-xs uppercase">Bakery Menu</h2>
            </div>
            <span class="text-[10px] font-bold text-slate-400 uppercase">7 Items</span>
        </div>

        <!-- Menu List Container -->
        <div id="menuContainer" class="space-y-2"></div>

        <!-- Sticky Footer Summary -->
        <div class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 p-3 z-20 shadow-lg rounded-t-2xl">
            <div class="max-w-md mx-auto flex items-center justify-between">
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Quantity</p>
                    <p class="text-xl font-black text-navyDark"><span id="totalQtyDisplay">0</span> <span class="text-xs font-semibold text-slate-500">units</span></p>
                </div>
                <button type="submit" id="submitBtn" class="bg-navyPrimary hover:bg-navyDark text-white px-6 py-2.5 rounded-xl text-xs font-bold shadow-md shadow-navyPrimary/20 transition-all flex items-center space-x-1.5 btn-press">
                    <span>PLACE ORDER</span> 
                    <i class="fa-solid fa-paper-plane text-[10px]"></i>
                </button>
            </div>
        </div>
    </form>

    <!-- Footer Copyright -->
    <div class="text-center mt-6 mb-4">
        <p style="font-size: 9px; color: #94a3b8; font-weight: 300;">@2026 Independence Hotel, Sihanoukville</p>
    </div>

    <script>
        const bakeryItems = [
            { id: 'item1', name: 'Pain Croissant', price: 2.00 },
            { id: 'item2', name: 'Chocolate Croissant', price: 2.50 },
            { id: 'item3', name: 'Almond Croissant', price: 2.80 },
            { id: 'item4', name: 'Banana Cake', price: 1.50 },
            { id: 'item5', name: 'Pain au Raisin Roll', price: 2.50 },
            { id: 'item6', name: 'Danish Banana', price: 2.20 },
            { id: 'item7', name: 'Danish Apple', price: 2.20 }
        ];

        const menuContainer = document.getElementById('menuContainer');
        const quantities = {};

        bakeryItems.forEach(item => {
            quantities[item.id] = 0; 
            
            const card = document.createElement('div');
            card.className = "bg-cardWhite p-3 rounded-xl shadow-sm border border-slate-200/80 flex justify-between items-center";
            card.innerHTML = `
                <div class="flex-1 pr-2">
                    <h3 class="font-bold text-xs text-slate-900">${item.name}</h3>
                </div>
                <div class="flex items-center space-x-1.5 bg-slate-50 rounded-lg p-1 border border-slate-200">
                    <button type="button" class="w-7 h-7 flex items-center justify-center text-navyPrimary bg-white rounded-md shadow-sm border border-slate-200 btn-press font-bold" onclick="updateQty('${item.id}', -1, ${item.price})">
                        <i class="fa-solid fa-minus text-[10px]"></i>
                    </button>
                    <input type="number" id="qty-${item.id}" value="0" min="0" class="font-black text-navyDark w-8 text-center text-xs bg-transparent focus:outline-none" oninput="manualInputQty('${item.id}', this.value, ${item.price})">
                    <button type="button" class="w-7 h-7 flex items-center justify-center text-white bg-navyPrimary rounded-lg shadow-sm btn-press font-bold" onclick="updateQty('${item.id}', 1, ${item.price})">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                    </button>
                </div>
            `;
            menuContainer.appendChild(card);
        });

        let totalQty = 0;
        let totalAmount = 0.00;

        window.updateQty = function(id, change, price) {
            let currentQty = quantities[id];
            let newQty = currentQty + change;
            if (newQty < 0) return; 

            quantities[id] = newQty;
            document.getElementById(`qty-${id}`).value = newQty;

            totalQty += change;
            totalAmount += (change * price);
            
            document.getElementById('totalQtyDisplay').innerText = totalQty;
        };

        window.manualInputQty = function(id, val, price) {
            let parsedVal = parseInt(val);
            if (isNaN(parsedVal) || parsedVal < 0) parsedVal = 0;
            
            let oldQty = quantities[id];
            let diff = parsedVal - oldQty;
            
            quantities[id] = parsedVal;
            totalQty += diff;
            totalAmount += (diff * price);
            
            document.getElementById('totalQtyDisplay').innerText = totalQty;
        };

        document.getElementById('orderDate').valueAsDate = new Date();

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (totalQty === 0) {
                alert("Please add at least one bakery item to your order!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> <span>SENDING...</span>`;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80');

            const data = {
                branch: document.getElementById('branch').value,
                orderDate: document.getElementById('orderDate').value,
                item1: quantities['item1'] || 0,
                item2: quantities['item2'] || 0,
                item3: quantities['item3'] || 0,
                item4: quantities['item4'] || 0,
                item5: quantities['item5'] || 0,
                item6: quantities['item6'] || 0,
                item7: quantities['item7'] || 0,
                pickupTime: document.getElementById('pickupTime').value,
                orderedBy: document.getElementById('orderedBy').value,
                totalQty: totalQty,
                totalAmount: totalAmount.toFixed(2)
            };

            const webAppUrl = "https://script.google.com/macros/s/AKfycbxoG9cwwyJ9HK2tkiXMtrKJ_Axj3evXW6mPxx5Sf6eNHOxCWubZNJSdjh0S4HH_7DIT9g/exec"; 

            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                submitBtn.innerHTML = `<i class="fa-solid fa-check mr-1"></i> <span>SUCCESS!</span>`;
                submitBtn.style.backgroundColor = "#10B981";
                setTimeout(() => { window.location.reload(); }, 2500);
            }).catch(error => {
                console.error(error);
                submitBtn.innerHTML = `ERROR - TRY AGAIN`;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80');
            });
        });
    </script>
</body>
</html>
